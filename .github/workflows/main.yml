name: Library Management System CI

run-name: CI for ${{ github.repository }}

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: List pom files
        run: find . -name "pom.xml"

      - name: Build all Maven services
        run: |
          find . -name "pom.xml" | while read pom; do
            dir=$(dirname "$pom")
            echo "Building $dir"
            (cd "$dir" && mvn clean install)
          done

      - name: Run tests for all Maven services
        run: |
          find . -name "pom.xml" | while read pom; do
            dir=$(dirname "$pom")
            echo "Testing $dir"
            (cd "$dir" && mvn test)
          done
