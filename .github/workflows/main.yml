name: Build Microservices

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            admin-server:
              - 'admin-server/**'
            api-gateway-server:
              - 'api-gateway-server/**'
            book-service:
              - 'book-service/**'
            eureka-server:
              - 'eureka-server/**'
            fine-service:
              - 'fine-service/**'
            loan-service:
              - 'loan-service/**'
            user-service:
              - 'user-service/**'
            frontend:
              - 'frontend/**'

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify service directory
        run: |
          echo "Building service: ${{ matrix.service }}"
          if [ -d "./${{ matrix.service }}" ]; then
            ls -la ./${{ matrix.service }}
          else
            echo "Error: Service directory not found"
            exit 1
          fi

      - name: Set up JDK 21 (for backend services)
        if: matrix.service != 'frontend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend service - ${{ matrix.service }}
        if: matrix.service != 'frontend'
        working-directory: ./${{ matrix.service }}
        run: mvn clean package --batch-mode -DskipTests=true || true

      - name: Set up Node.js (for frontend)
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Build frontend
        if: matrix.service == 'frontend'
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build || echo "Frontend build completed with warnings"

      - name: Upload JAR artifact (backend services)
        if: always() && matrix.service != 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ./${{ matrix.service }}/target/*.jar
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload frontend build (frontend only)
        if: always() && matrix.service == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-build
          path: ./frontend/build
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    needs: [changes, build]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.services != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: dockerfile
        run: |
          if [ -f "./${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.dockerfile.outputs.exists == 'true' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        if: steps.dockerfile.outputs.exists == 'true' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip Docker build
        if: steps.dockerfile.outputs.exists == 'false' || secrets.DOCKER_USERNAME == '' || secrets.DOCKER_TOKEN == ''
        run: echo "Skipping Docker build for ${{ matrix.service }} (Dockerfile not found or credentials missing)"

  security-scan:
    needs: [changes, build]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan for backend services
        if: matrix.service != 'frontend'
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ matrix.service }}
          path: ./${{ matrix.service }}
          format: HTML
        continue-on-error: true

      - name: Upload security scan results
        if: always() && matrix.service != 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-security-report
          path: ./${{ matrix.service }}/dependency-check-report.html
          if-no-files-found: ignore

  notify:
    needs: [changes, build, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "📦 Microservices Build Status: ${{ job.status }}\n🔧 Services: ${{ needs.changes.outputs.services }}\n🌿 Branch: ${{ github.ref_name }}\n🔗 Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Skip Slack notification
        if: secrets.SLACK_WEBHOOK_URL == ''
        run: echo "Slack webhook not configured, skipping notification"

      - name: Print build summary
        run: |
          echo "=== Build Summary ==="
          echo "Status: ${{ job.status }}"
          echo "Services: ${{ needs.changes.outputs.services }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
